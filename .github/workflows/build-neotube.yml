name: Build NeoTube APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path ZIP proyek di repo"
        default: "NeoTube.zip"
      extractor_version:
        description: "Versi NewPipeExtractor (tag JitPack)"
        default: "v0.27.1"
  push:
    paths:
      - "NeoTube.zip"
      - ".github/workflows/build-neotube.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek
        run: |
          set -e
          ZIP="${{ github.event.inputs.zip_path }}"
          ZIP="${ZIP:-NeoTube.zip}"
          if [ ! -f "$ZIP" ]; then
            echo "ZIP tidak ditemukan: $ZIP"; ls -la; exit 1
          fi
          rm -rf "$RUNNER_TEMP/src"; mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
          SETTINGS=$(find "$RUNNER_TEMP/src" -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts tidak ada di dalam ZIP"; exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain -PnewpipeVersion="${{ github.event.inputs.extractor_version || 'v0.27.1' }}" 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Kalau gagal: tampilkan HANYA error-nya, di baris paling bawah log + di tab Ringkasan.
      - name: Tampilkan error build
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          clean() { sed -E 's#file://[^ ]*/app/neotube/#@#; s#file://[^ ]*/app/src/main/##'; }
          echo "=============== ERROR BUILD ==============="
          grep -E '^e: ' "$LOG" | clean | head -n 40 || true
          grep -E -A6 'What went wrong' "$LOG" | head -n 20 || true
          {
            echo '### Error build'
            echo '```'
            grep -E '^e: ' "$LOG" | clean | head -n 40 || true
            grep -E -A6 'What went wrong' "$LOG" | head -n 20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: NeoTube-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
